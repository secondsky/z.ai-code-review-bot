name: 'Z.ai Code Review'
description: 'AI-powered pull-request code review and interactive /zai assistant using Z.ai GLM models.'
author: 'z.ai-code-review-bot contributors'
branding:
  icon: 'check-circle'
  color: 'gray-dark'

inputs:
  ZAI_API_KEY:
    description: 'Z.ai API key. Store as a GitHub SECRET (not a variable). Required.'
    required: true

  ZAI_MODEL:
    description: 'Z.ai model name (e.g. glm-5.2, glm-4.7).'
    required: false
    default: 'glm-5.2'

  ZAI_SYSTEM_PROMPT:
    description: 'System prompt for the review model. Falls back to a built-in default when empty.'
    required: false
    default: ''

  ZAI_REVIEWER_NAME:
    description: 'Header label shown in the review comment.'
    required: false
    default: 'Z.ai Code Review'

  EXCLUDE_PATTERNS:
    description: 'Comma-separated glob patterns to exclude from review.'
    required: false
    default: '*.lock,package-lock.json,yarn.lock,pnpm-lock.yaml'

  MAX_DIFF_CHARS:
    description: |-
      Hard cap on total diff chars sent to the model per review batch. 0 =
      unlimited (NOT recommended — a large PR can produce a huge prompt and
      exhaust your Z.ai quota; the cap defends against cost abuse from fork
      PRs). The structured-review pipeline batches large PRs regardless; this
      cap limits each batch's prompt size.
    required: false
    default: '100000'

  # --- Large-PR batching knobs ---
  ZAI_LARGE_PR_FILE_THRESHOLD:
    description: 'Patchable file count that triggers batched review mode.'
    required: false
    default: '50'

  ZAI_MAX_BATCH_CHARS:
    description: 'Character budget per review batch.'
    required: false
    default: '120000'

  ZAI_MAX_FILES_PER_BATCH:
    description: 'Maximum distinct files packed into a single batch.'
    required: false
    default: '40'

  ZAI_MAX_PATCH_CHARS:
    description: 'Max diff chars for a single file before it is split across review parts.'
    required: false
    default: '18000'

  # --- Command surface (OFF by default; auth-gated when on) ---
  ZAI_COMMANDS_ENABLED:
    description: |-
      Enable interactive /zai commands (ask, review, explain, describe, impact, help).
      OFF by default. When enabled, authorization is MANDATORY: combine with the
      workflow `if:` gate on author_association (see the example workflows) and
      ZAI_AUTH_THRESHOLD. Never enable commands without the workflow gate.
    required: false
    default: 'false'

  ZAI_AUTH_THRESHOLD:
    description: |-
      Minimum relationship to the repo required to use /zai commands (in-code check).
      One of: admin | maintain | write | read | none.
      write = OWNER + MEMBER + COLLABORATOR. `none` disables the in-code check
      (relies entirely on the workflow `if:` gate — not recommended).
    required: false
    default: 'write'

  ZAI_ALLOW_FORK_COMMANDS:
    description: 'Allow /zai commands on pull requests from forks (default false). Leave false unless you trust fork contributors.'
    required: false
    default: 'false'

  # --- Networking ---
  ZAI_TIMEOUT_MS:
    description: 'Z.ai request timeout in milliseconds, applied to every attempt (retries use a progressive fraction).'
    required: false
    default: '120000'

  # --- Scheduled batch review (opt-in, OFF by default) ---
  ZAI_SCHEDULE_ENABLED:
    description: |-
      Enable scheduled batch re-review of open PRs (the `schedule` event). OFF
      by default. When enabled, a schedule trigger lists open non-draft PRs and
      reviews any whose head SHA does not already have a Z.ai marker comment
      (dedup by SHA — only new/changed PRs are reviewed each tick).
    required: false
    default: 'false'

  ZAI_SCHEDULE_MAX_PRS:
    description: 'Maximum number of PRs to review per scheduled run.'
    required: false
    default: '10'

  # --- describe/impact opt-in mutations (OFF by default; v1 stays read-only) ---
  ZAI_DESCRIBE_WRITE_BODY:
    description: |-
      When true, /zai describe upserts a marked <!-- zai-description --> block
      into the PR body via pulls.update (only the marked block is mutated).
      Requires pull-requests: write. OFF by default.
    required: false
    default: 'false'

  ZAI_IMPACT_LABELS:
    description: |-
      When true, /zai impact applies a zai:-prefixed label based on the severity
      the model emits. Only zai: labels are managed; human labels are untouched.
      Requires issues: write. OFF by default.
    required: false
    default: 'false'

  ZAI_IMPACT_LABEL_MAP:
    description: 'Comma-separated severity=label map for ZAI_IMPACT_LABELS.'
    required: false
    default: 'critical=zai:critical,high=zai:high,medium=zai:medium,low=zai:low'

  # --- v2 structured-review knobs ---
  ZAI_MAX_FINDINGS:
    description: |-
      Maximum number of findings the review will emit (after ranking + capping).
      Findings above this cap are dropped (highest-severity first). Clamped to
      [1, 50] — values outside that range fall back to the default.
    required: false
    default: '8'

  ZAI_MIN_SEVERITY:
    description: |-
      Lowest severity to include in the review. One of: critical, high, medium,
      low, info. Findings below this threshold are filtered out. Invalid values
      fall back to 'info' (with a warning).
    required: false
    default: 'info'

  ZAI_TEMPERATURE:
    description: |-
      Sampling temperature for the review model (0-2). Lower values are more
      deterministic; higher values are more diverse. Clamped to [0, 2]; invalid
      values fall back to 0.2. (Reserved for a future task that wires this into
      the API client.)
    required: false
    default: '0.2'

  ZAI_MAX_TOKENS:
    description: |-
      Maximum tokens to generate per model call. Clamped to a minimum of 1;
      invalid values fall back to 4096. (Reserved for a future task that wires
      this into the API client.)
    required: false
    default: '4096'

  ZAI_BATCH_CONCURRENCY:
    description: |-
      Maximum number of review batches to run concurrently (in parallel) inside
      a single structured-review run. Larger PRs produce multiple batches; this
      knob caps how many are in flight at once so a big PR does not N serial API
      calls. Default 3, clamped to [1, 8]. Findings remain deterministic
      regardless of completion order (results are merged in batch order).
    required: false
    default: '3'

  ZAI_FALLBACK_PROMPT:
    description: |-
      Optional fallback prompt that activates the API client's timeout-fallback
      path: when a request times out twice in a row, subsequent attempts use
      this prompt instead of the original (often a shorter, "summary-only"
      instruction). Empty (default) disables the fallback. When set, the
      fallback fires only on timeouts, never on auth/validation/4xx errors.
    required: false
    default: ''

  # --- v2 deterministic scanner layer (Phase 4) ---
  ZAI_SCANNERS_ENABLED:
    description: |-
      Master switch for the deterministic scanner layer. When true (default),
      secrets + code-pattern + metrics scanners run BEFORE the LLM review and
      their findings are (a) surfaced as high-confidence findings directly and
      (b) injected into the LLM prompt as "already detected" context so the
      model doesn't re-report them. When false, no scanners run at all. A
      repo-level .zai.yml can DISABLE individual scanners (secrets, patterns,
      metrics) but cannot enable one the action turned off.
    required: false
    default: 'true'

  ZAI_SCANNERS_CACHE_DIR:
    description: |-
      Directory where scanner binaries (gitleaks, ast-grep) are cached after
      download + SHA256 verification. Defaults to ~/.zai-cache/scanners. The
      directory is created on first use.
    required: false
    default: '~/.zai-cache/scanners'

  # --- v2 commit-status feedback (Phase 5) ---
  ZAI_COMMIT_STATUS:
    description: |-
      Post a commit status (pending → success/failure) to the PR's head SHA so
      developers see review progress immediately instead of staring at a silent
      PR. ON by default. Requires `statuses: write` in the workflow's
      `permissions:` block (see the example workflow). If the scope is missing
      the status post is silently skipped (best-effort) — the review itself is
      unaffected. Set to `false` to disable entirely.
    required: false
    default: 'true'

  # --- v2 walkthrough / cohort ordering (Phase 7) ---
  ZAI_WALKTHROUGH:
    description: |-
      Render the review summary as a dependency-ordered "walkthrough" —
      findings are grouped into collapsible cohort sections (database → api →
      business-logic → config → ui → tests → docs → other) so the summary reads
      like a narrative of the change rather than a flat severity-sorted list.
      ON by default. Only the SUMMARY rendering changes; inline line-anchored
      comments are unaffected. Set to `false` to fall back to the flat
      severity-grouped summary.
    required: false
    default: 'true'

  ZAI_REPO_CONFIG_ENABLED:
    description: |-
      Master switch for in-repo `.zai.yml` configuration. When true (default),
      the bot fetches `.zai.yml` from the PR's head SHA and merges it with the
      action inputs. The file can only NARROW behavior (add path instructions,
      set tone, lower the findings cap, add excludes, disable a scanner) — it
      can NEVER widen it (raise a cap, disable auth, lower cost caps, or enable
      a scanner the action turned off). This is a security constraint: the file
      is attacker-controllable in fork PRs. Set to `false` to disable
      `.zai.yml` loading entirely.
    required: false
    default: 'true'

  GITHUB_TOKEN:
    description: 'GitHub token for API access. Defaults to the auto-provided github.token.'
    required: false
    default: '${{ github.token }}'

runs:
  using: 'node20'
  main: 'dist/index.js'
